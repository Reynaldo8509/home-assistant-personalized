- id: hermes_confirmar_wol_laptop_device_two
  alias: Encender y confirmar Laptop de device_two
  description: Envía Wake-on-LAN y confirma por ping; no inicia otras acciones.
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id: input_boolean.wake_laptop_device_two
    to: 'on'
  condition:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered)) > 300 }}'
  - condition: template
    value_template: '{{ not is_state(''binary_sensor.cuarto_device_two_laptop_device_two'', ''on'') }}'
  action:
  - service: homeassistant.update_entity
    target:
      entity_id: binary_sensor.cuarto_device_two_laptop_device_two
  - service: wake_on_lan.send_magic_packet
    data:
      mac: 02:00:00:00:00:01
      broadcast_address: 192.0.2.10
  - repeat:
      sequence:
      - delay: 00:00:10
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.cuarto_device_two_laptop_device_two
      until:
      - condition: template
        value_template: '{{ is_state(''binary_sensor.cuarto_device_two_laptop_device_two'', ''on'') or repeat.index >= 12 }}'
  - choose:
    - conditions: '{{ is_state(''binary_sensor.cuarto_device_two_laptop_device_two'', ''on'') }}'
      sequence:
      - service: persistent_notification.create
        data:
          title: Wake-on-LAN
          message: Laptop de device_two encendida y visible en la red.
    default:
    - service: persistent_notification.create
      data:
        title: Wake-on-LAN
        message: No se pudo confirmar el encendido de la Laptop de device_two después de 2 minutos.
    - service: logbook.log
      data:
        name: Domus · Wake-on-LAN
        message: No se pudo confirmar el encendido de la Laptop de device_two.
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.wake_laptop_device_two

