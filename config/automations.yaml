- id: hermes_confirmar_wol_impresora_hp
  alias: Despertar y confirmar impresora HP
  description: Envía Wake-on-LAN y confirma disponibilidad; no imprime nada.
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id: input_boolean.wake_impresora_hp
    to: 'on'
  condition:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 300 }}'
  - condition: template
    value_template: '{{ states(''sensor.hp_smart_tank_710_720_series'') in [''unknown'',
      ''unavailable'', ''none''] }}'
  action:
  - service: homeassistant.update_entity
    target:
      entity_id: sensor.hp_smart_tank_710_720_series
  - service: wake_on_lan.send_magic_packet
    data:
      mac: 02:00:00:00:00:01
      broadcast_address: 192.0.2.10
  - wait_template: '{{ states(''sensor.hp_smart_tank_710_720_series'') not in [''unknown'',
      ''unavailable'', ''none''] }}'
    timeout: 00:01:00
    continue_on_timeout: true
  - choose:
    - conditions: '{{ states(''sensor.hp_smart_tank_710_720_series'') not in [''unknown'',
        ''unavailable'', ''none''] }}'
      sequence:
      - service: persistent_notification.create
        data:
          title: Despertar impresora
          message: La impresora HP responde en la red. No se envió ningún trabajo
            de impresión.
    default:
    - service: persistent_notification.create
      data:
        title: Despertar impresora
        message: No se pudo confirmar que la impresora HP respondiera después de 1
          minuto.
    - service: logbook.log
      data:
        name: Domus · Wake-on-LAN
        message: No se pudo confirmar la disponibilidad de la impresora HP.
    - service: persistent_notification.create
      data:
        title: Domus · Wake-on-LAN
        message: No se pudo confirmar la disponibilidad de la impresora HP después de 1 minuto.
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.wake_impresora_hp
