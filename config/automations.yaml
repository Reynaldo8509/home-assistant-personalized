- id: hermes_ping_laptops_cada_5_min
  alias: Domus · actualizar disponibilidad de equipos críticos cada 15 min
  description: Actualiza solo estados de conectividad, sin SSH ni notificaciones.
  triggers:
  - minutes: /15
    trigger: time_pattern
  actions:
  - target:
      entity_id:
      - binary_sensor.192_168_18_22
      - binary_sensor.cuarto_device_two_laptop_device_two
      - binary_sensor.192_168_18_12
      - binary_sensor.sala_general_firetvstick_de_denis_connectivity
    action: homeassistant.update_entity
  mode: single
